name: Start Windows Desktop RDP with Tailscale

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and Desktop Experience
        shell: powershell
        run: |
          $password = "TempPass123!"
          net user runneradmin $password /add
          net localgroup Administrators runneradmin /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name "Audiosrv" -StartupType Automatic
          Start-Service -Name "Audiosrv"
          Write-Host "Kullanici Adi: runneradmin | Sifre: $password"

      - name: Install Tailscale
        shell: powershell
        run: |
          winget install --id Tailscale.Tailscale -e --silent --accept-package-agreements --accept-source-agreements
          $env:Path += ";C:\Program Files\Tailscale"
          Start-Service Tailscale -ErrorAction SilentlyContinue

      - name: Connect to Tailscale network
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_AUTHKEY --hostname=gh-win-desktop
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
