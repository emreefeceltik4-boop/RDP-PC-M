name: Start Real Windows 10 (QEMU) with Tailscale

on:
  workflow_dispatch:

jobs:
  win10-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check KVM and install QEMU + Tailscale
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-kvm curl
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo tailscaled --tun=userspace-networking --socks5-server=localhost:1055 &
          sleep 3
          sudo tailscale up --authkey="${TS_AUTHKEY}" --hostname=gh-win10-qemu
          sudo tailscale ip -4

      - name: Download Windows 10 image and boot QEMU
        run: |
          # Buraya kendi hazır/önceden hazırlanmış qcow2 veya raw Windows 10 disk imajının indirme bağlantısını koymalısın
          # Örnek: curl -L -o win10.qcow2 "SENIN_IMAC_URL_ADRESIN"
          echo "Windows 10 qcow2 imajını indirip QEMU ile başlatma adımı"
